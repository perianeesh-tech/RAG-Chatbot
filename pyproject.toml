[project]
name = "rag"
version = "0.1.0"
description = "A local RAG chatbot built with LlamaIndex and Ollama"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "llama-index>=0.14.24",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-llms-ollama>=0.11.0",
    "torch>=2.14.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
